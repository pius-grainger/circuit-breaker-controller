apiVersion: v1
kind: ServiceAccount
metadata:
  name: circuit-breaker-controller
  namespace: circuit-breaker-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: circuit-breaker-controller
rules:
- apiGroups: ["circuitbreaker.io"]
  resources: ["circuitbreakers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["circuitbreaker.io"]
  resources: ["circuitbreakers/status"]
  verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: circuit-breaker-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: circuit-breaker-controller
subjects:
- kind: ServiceAccount
  name: circuit-breaker-controller
  namespace: circuit-breaker-system