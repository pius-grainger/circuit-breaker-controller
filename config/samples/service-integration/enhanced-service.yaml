apiVersion: v1
kind: Service
metadata:
  name: enhanced-service
  namespace: default
spec:
  selector:
    app: enhanced-app
  ports:
  - port: 80
    targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enhanced-app
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: enhanced-app
  template:
    metadata:
      labels:
        app: enhanced-app
    spec:
      containers:
      - name: app
        image: nginx:alpine
        ports:
        - containerPort: 8080