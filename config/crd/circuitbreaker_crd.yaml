apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: circuitbreakers.circuitbreaker.io
spec:
  group: circuitbreaker.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              targetRef:
                type: object
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - apiVersion
                - kind
                - name
              failureThreshold:
                type: integer
                minimum: 1
              successThreshold:
                type: integer
                minimum: 1
                default: 1
              timeoutSeconds:
                type: integer
                minimum: 1
              resetTimeout:
                type: integer
                minimum: 1
              strategy:
                type: object
                properties:
                  mode:
                    type: string
                    enum: ["count", "rate"]
                    default: "count"
                  window:
                    type: string
                    default: "1m"
            required:
            - failureThreshold
            - timeoutSeconds
            - resetTimeout
          status:
            type: object
            properties:
              state:
                type: string
                enum: ["Closed", "Open", "HalfOpen"]
              failureCount:
                type: integer
                default: 0
              successCount:
                type: integer
                default: 0
              lastFailure:
                type: string
                format: date-time
              lastSuccess:
                type: string
                format: date-time
              lastTransitionTime:
                type: string
                format: date-time
              reason:
                type: string
              message:
                type: string
              targetApplied:
                type: boolean
                default: false
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    reason:
                      type: string
                    message:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: circuitbreakers
    singular: circuitbreaker
    kind: CircuitBreaker