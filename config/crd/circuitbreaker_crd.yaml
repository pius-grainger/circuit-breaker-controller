apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: circuitbreakers.circuitbreaker.io
spec:
  group: circuitbreaker.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              failureThreshold:
                type: integer
                minimum: 1
              timeoutSeconds:
                type: integer
                minimum: 1
              resetTimeout:
                type: integer
                minimum: 1
            required:
            - failureThreshold
            - timeoutSeconds
            - resetTimeout
          status:
            type: object
            properties:
              state:
                type: string
                enum: ["Closed", "Open", "HalfOpen"]
              failureCount:
                type: integer
              lastFailure:
                type: string
                format: date-time
    subresources:
      status: {}
  scope: Namespaced
  names:
    plural: circuitbreakers
    singular: circuitbreaker
    kind: CircuitBreaker